[package]
name = "prek"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Low-level Linux input tools and gesture recognition"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[test]]
name = "supervisor"
# Worker fixtures must start on the exec thread for parent-death protection.
harness = false

[[test]]
name = "recovery"
harness = false

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
luna = { git = "https://github.com/onix-os/luna", rev = "8b370fc7975cc9a3fbf18c07d9250d63aa2bbca6" }
luna-util = { git = "https://github.com/onix-os/luna", rev = "8b370fc7975cc9a3fbf18c07d9250d63aa2bbca6" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
sha2 = { version = "=0.10.9", default-features = false }
nix = { version = "0.30", features = ["fs", "ioctl", "poll", "time"] }

[dev-dependencies]

