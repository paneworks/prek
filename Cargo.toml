[package]
name = "prek"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Low-level Linux input tools and gesture recognition"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[test]]
name = "supervisor"
# Worker fixtures must start on the exec thread for parent-death protection.
harness = false

[[test]]
name = "recovery"
harness = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.30", features = ["ioctl", "poll", "time"] }

[dev-dependencies]

