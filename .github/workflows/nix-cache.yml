name: nix-cache

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'paneworks/prek' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - name: Check publishing credentials
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          PIN_TOKEN: ${{ secrets.PIN_TOKEN }}
        run: |
          if [ -z "$ATTIC_TOKEN" ] || [ -z "$PIN_TOKEN" ]; then
            echo "::error::Add the ATTIC_TOKEN and PIN_TOKEN Actions secrets for cache.bresilla.com."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            extra-substituters = https://cache.bresilla.com/bresilla
            extra-trusted-public-keys = bresilla:zsecaZYIrjCJQS4AuGPmEVU5PRkiMmB/Mds3KaCzTvE=
      - name: Build the application and its native gates
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$TAG" = "v$version"
          nix build --no-update-lock-file --print-build-logs --max-jobs 1 --cores 2 \
            --no-link --print-out-paths .#default > "$RUNNER_TEMP/prek-store-paths"
          test "$(wc -l < "$RUNNER_TEMP/prek-store-paths")" -eq 1
          bash tests/run-nix-gate.sh
      - name: Collect store paths and pins
        id: release
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          path=$(cat "$RUNNER_TEMP/prek-store-paths")
          echo "$path" > "$RUNNER_TEMP/push-paths"
          echo "prek-$SYSTEM $path" > "$RUNNER_TEMP/push-pins"
          { echo "paths<<EOF"; cat "$RUNNER_TEMP/push-paths"; echo EOF
            echo "pins<<EOF"; cat "$RUNNER_TEMP/push-pins"; echo EOF; } >> "$GITHUB_OUTPUT"
      # Only paths cache.nixos.org lacks; see bresilla/nixos .github/actions/attic-push.
      - uses: bresilla/nixos/.github/actions/attic-push@main
        with:
          paths: ${{ steps.release.outputs.paths }}
          pins: ${{ steps.release.outputs.pins }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          pin-token: ${{ secrets.PIN_TOKEN }}
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}

  verify-download:
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            extra-substituters = https://cache.bresilla.com/bresilla
            extra-trusted-public-keys = bresilla:zsecaZYIrjCJQS4AuGPmEVU5PRkiMmB/Mds3KaCzTvE=
      - name: Download the application without builders and run installed checks
        run: |
          set -euo pipefail
          prek=$(nix build --no-update-lock-file --max-jobs 0 --builders '' \
            --no-link --print-out-paths .#default)
          "$prek/bin/prek" --version
          test -f "$prek/share/prek/lua/prek.lua"
          "$prek/bin/prek" init --preset minimal --output "$RUNNER_TEMP/init.lua"
          "$prek/bin/prek" check --config "$RUNNER_TEMP/init.lua" --json > /dev/null
