name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vVERSION tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Validate release tag before checkout
        id: tag
        env:
          PREK_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ "$PREK_TAG" =~ $pattern ]] || { echo 'Expected an existing vVERSION tag' >&2; exit 2; }
          printf 'tag=%s\n' "$PREK_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - name: Pin immutable release revision
        id: revision
        env:
          PREK_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$PREK_TAG" = "v$version"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  bundles:
    needs: validate
    uses: ./.github/workflows/nix-bundles.yml
    with:
      revision: ${{ needs.validate.outputs.revision }}
      tag: ${{ needs.validate.outputs.tag }}

  publish:
    needs: [validate, bundles]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prek-nix-*
          path: dist
          merge-multiple: true
      - name: Check both native bundles
        run: |
          set -euo pipefail
          cd dist
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 2
          test "$(find . -maxdepth 1 -name '*-x86_64-linux-nix.tar.gz' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*-aarch64-linux-nix.tar.gz' | wc -l)" -eq 1
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          rm ./*.sha256
      - name: Publish verified Nix application bundles
        env:
          GH_TOKEN: ${{ github.token }}
          PREK_TAG: ${{ needs.validate.outputs.tag }}
          PREK_REVISION: ${{ needs.validate.outputs.revision }}
          PREK_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$PREK_REPOSITORY/commits/$PREK_TAG" --jq '.sha')" = "$PREK_REVISION"
          gh release view "$PREK_TAG" --repo "$PREK_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$PREK_TAG" --repo "$PREK_REPOSITORY" --title "$PREK_TAG" \
                 --target "$PREK_REVISION" --generate-notes
          gh release upload "$PREK_TAG" dist/SHA256SUMS dist/*.tar.gz --clobber --repo "$PREK_REPOSITORY"
