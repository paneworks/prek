name: tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  nixos-module:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check installed module, Lua editor, routing helper and Wayland proxy
        run: |
          prek_system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build --no-write-lock-file ".#checks.${prek_system}.nixos-module" ".#checks.${prek_system}.lua-editor" ".#checks.${prek_system}.native-routing-helper" ".#checks.${prek_system}.wayland-proxy"

  verify:
    env:
      RUST_TEST_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        rust: [stable, "1.88.0"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-
      - name: Verify
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -Dwarnings
          cargo test --locked --all-targets --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps
          cargo build --locked --bin prek
          PREK_TEST_LUA_BINARY="$PWD/target/debug/prek" cargo test --locked --lib \
            route_worker::tests::recognizers::actual::supervised_callbacks_cross_the_sole_worker_protocol_with_native_ownership \
            -- --exact --ignored --test-threads=1 | tee target/native-routing-helper.log
          grep -F 'test result: ok. 1 passed; 0 failed;' target/native-routing-helper.log
          cargo run --locked -- --help

